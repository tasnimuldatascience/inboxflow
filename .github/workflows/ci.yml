name: InboxFlow checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          {
            POSTGRES_DB: inboxflow,
            POSTGRES_USER: inboxflow,
            POSTGRES_PASSWORD: ci-only-password,
          }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U inboxflow" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm install -g pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --audit-level moderate
      - run: pnpm db:migrate && pnpm db:seed
        env:
          DATABASE_URL: postgresql://inboxflow:ci-only-password@localhost:5432/inboxflow
      - run: pnpm exec playwright install --with-deps chromium
      - run: docker compose up -d objectstore redis
      - run: pnpm test:postgres
        env:
          DATABASE_URL: postgresql://inboxflow:ci-only-password@localhost:5432/inboxflow
      - run: pnpm test:e2e
      - run: pnpm build
        env: { NEXT_TELEMETRY_DISABLED: "1" }
      - run: docker compose config --quiet
      - run: docker build -t inboxflow:ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: browser-report, path: "playwright-report/" }
